# Mergify: approve Dependabot's pull requests, and merge them once CI passes.
#
# Dependabot opens its pull requests against alpha (see .github/dependabot.yml),
# so that is the branch merged into. A dependency update then reaches main with
# the rest of alpha, through the usual pull request from alpha to main.
#
# see:
#  - https://docs.mergify.com/getting-started/
#  - https://docs.mergify.com/conditions/
pull_request_rules:
  - name: automatic approve dependabot pull requests
    conditions:
      - "author~=dependabot[bot]|dependabot-preview[bot]|dependabot"
    actions:
      review:
        type: APPROVE

  - name: automatic merge dependabot pull requests
    conditions:
      - "author~=dependabot[bot]|dependabot-preview[bot]|dependabot"
      - "#approved-reviews-by>=1"
      - "base=alpha"
      # every job of test.yml (and build.yml) must have passed on the pull request
      - "check-success=test (1.26)"
      - "check-success=test (1.27)"
    actions:
      merge:
        method: merge
