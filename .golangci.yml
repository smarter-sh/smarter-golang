# golangci-lint's configuration: see skills/smarter-code-quality and ADR-014.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: receiver-naming
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    paths:
      - sam/
    rules:
      # tests read files of their own testdata, and status codes read better as numbers there.
      - path: _test\.go
        linters: [gosec, errorlint, usestdlibvars]
formatters:
  enable:
    - gofmt
    - goimports
