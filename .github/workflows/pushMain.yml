---
#---------------------------------------------------------
# - Create a semantic release
# - After a release, merge main into alpha and beta, so that the next pull
#   request from alpha starts from the release commit (CHANGELOG.md and
#   version.go) instead of conflicting with it
#---------------------------------------------------------
name: Push to main

on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  semantic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
      NODE_ENV: test
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Semantic Release
        id: semantic
        # A release commits CHANGELOG.md and version.go (@semantic-release/git), so HEAD moves.
        run: |
          before=$(git rev-parse HEAD)
          npx semantic-release
          if [[ "$(git rev-parse HEAD)" != "$before" ]]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

  # After the release, not before: the release commit is what alpha and beta
  # must have, or the next pull request from alpha conflicts with it.
  merge-main:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.PAT }}

      - name: Merge main into alpha
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: alpha

      - name: Merge main into beta
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: beta
